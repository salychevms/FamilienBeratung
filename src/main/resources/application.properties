vaadin.launch-browser=true
spring.application.name=FamilienBeratung
spring.web.locale=de_DE
spring.web.locale-resolver=fixed
spring.messages.basename=messages
spring.messages.encoding=UTF-8

app.data.dir=.

spring.datasource.url=jdbc:sqlite:${app.data.dir}/app.db?busy_timeout=10000
spring.datasource.driver-class-name=org.sqlite.JDBC

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.hibernate.SQL=off
logging.level.org.hibernate.orm.jdbc.bind=off

storage.base-path=${app.data.dir}/data/app/storage

test.autofill-database=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=50MB

spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000